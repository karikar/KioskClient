# Debian kiosk - logind beállítások
[Login]
# Csak a tty1 kap autologint, a tty2 vészhelyzeti karbantartásra marad.
NAutoVTs=2

# A házigép kikapcsoló gombja működjön (kiosk).
HandlePowerKey=poweroff
HandlePowerKeyLongPress=poweroff
HandleRebootKey=ignore

# Ne aludjon el/akadjon le a kiosk.
IdleAction=ignore
HandleLidSwitch=ignore
HandleLidSwitchExternalPower=ignore
