# Kiosk kiadás: egy "v1.2.3" tag feltöltésekor elkészíti a
# debian-kiosk-1.2.3.tar.gz (+ .sha256) csomagot, és GitHub Release-t hoz
# létre. A telepített kioskok kiosk-update.timer-je ezt figyeli és telepíti.
#
#   1. debian-kiosk/VERSION -> 1.2.3, commit
#   2. git tag v1.2.3 && git push origin main v1.2.3
name: release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: debian-kiosk
    steps:
      - uses: actions/checkout@v4

      - name: Függőségek
        run: sudo apt-get update -qq && sudo apt-get install -y -qq jq shellcheck

      - name: Shellcheck (tájékoztató)
        continue-on-error: true
        run: bash tests/lint.sh

      - name: Tesztek
        run: bash tests/run-all.sh

      - name: Csomag készítése
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: bash tools/make-release.sh "$GITHUB_WORKSPACE/dist"

      - name: GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          gh release create "$TAG" \
            "$GITHUB_WORKSPACE"/dist/*.tar.gz \
            "$GITHUB_WORKSPACE"/dist/*.tar.gz.sha256 \
            --title "Kiosk $TAG" \
            --generate-notes \
            --verify-tag
